name: Release

# Builds both binaries on each platform's own kind of machine, and runs them there.
# A v* tag becomes a release; every night main becomes the "nightly" prerelease, replacing
# the last one, unless nothing changed. A pull request touching this file only builds.
on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 18 * * *" # 03:17 in Seoul
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || github.ref_type == 'tag' && github.ref || 'nightly' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      label: ${{ steps.plan.outputs.label }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # version is what the binaries say; label is in the file names, the same every
          # night so links to them last.
          build=true publish=nightly label=nightly
          version="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            publish=none label=test version="test-${GITHUB_SHA::7}"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            publish=release label="$GITHUB_REF_NAME" version="$GITHUB_REF_NAME"
          elif [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            publish=none label=test
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            last=$(gh api "repos/$GITHUB_REPOSITORY/commits/nightly" --jq .sha 2>/dev/null || true)
            if [ "$last" = "$GITHUB_SHA" ]; then build=false publish=none; fi
          fi
          printf '%s\n' "build=$build" "publish=$publish" "version=$version" "label=$label" | tee -a "$GITHUB_OUTPUT"

  web:
    name: Web UI
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Plain files, so they are built once for every platform.
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: internal/webui/dist
          if-no-files-found: error

  build:
    name: ${{ matrix.os }}/${{ matrix.arch }}
    needs: [plan, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, arch: amd64, runner: ubuntu-24.04 }
          - { os: linux, arch: arm64, runner: ubuntu-24.04-arm }
          - { os: darwin, arch: amd64, runner: macos-15-intel }
          - { os: darwin, arch: arm64, runner: macos-15 }
          - { os: windows, arch: amd64, runner: windows-latest }
          - { os: windows, arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NAME: inaba_${{ needs.plan.outputs.label }}_${{ matrix.os }}_${{ matrix.arch }}
      PLATFORM: ${{ matrix.os }}/${{ matrix.arch }}
      # The SQLite driver is pure Go, so the binaries need no C library.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: internal/webui/dist
      - name: build
        run: |
          # The runner must be of the platform it builds for, not one translating it.
          test "$(go env GOOS)/$(go env GOARCH)" = "$PLATFORM"
          mkdir -p "out/$NAME"
          go build -trimpath -ldflags="-s -w -X github.com/Alex4386/inaba/internal/version.version=$VERSION" -o "out/$NAME/" ./cmd/inaba ./cmd/inaba-server
      - name: run what was built
        run: |
          cd "out/$NAME"
          for bin in inaba inaba-server; do
            said=$(./$bin --version)
            echo "$said"
            grep -F "$VERSION" <<< "$said" > /dev/null
          done
          ./inaba-server serve --listen 127.0.0.1:18080 --data smoke/inaba-server.db &
          server=$!
          for _ in $(seq 30); do curl -fsS http://127.0.0.1:18080/v1/config && break; sleep 1; done
          # The web UI is in there, not just its placeholder.
          curl -fsS http://127.0.0.1:18080/ui/ | grep -i '<script' > /dev/null
          kill $server
          wait $server || true
          rm -rf smoke
      - name: package
        run: |
          cp README.md LICENSE THIRD_PARTY_NOTICES.txt docs/CONFIGURATION.md "out/$NAME/"
          if [ "$RUNNER_OS" = Linux ]; then cp -R contrib/systemd "out/$NAME/"; fi
          cd out
          if [ "$RUNNER_OS" = Windows ]; then
            /c/Windows/System32/tar.exe -a -c -f "$NAME.zip" "$NAME"
          else
            tar -czf "$NAME.tar.gz" "$NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}
          path: |
            out/*.zip
            out/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish
    needs: [plan, build]
    if: needs.plan.outputs.publish != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: inaba_*
          merge-multiple: true
          path: files
      - name: checksums
        run: |
          cd files
          # One for each platform, or nothing is published.
          test "$(ls | wc -l)" -eq 6
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: release
        if: needs.plan.outputs.publish == 'release'
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" files/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $pre
      - name: nightly
        if: needs.plan.outputs.publish == 'nightly'
        run: |
          # A release keeps its date and tag, so the last nightly goes before this one takes its place.
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly files/* --target "$GITHUB_SHA" --prerelease --title "$VERSION" \
            --notes "Built from $GITHUB_SHA overnight. Things will break. If it does, congrats, you've found a bug."
