name: Release

# A v* tag becomes a GitHub release with every platform's archive. A pull request touching
# the build only builds.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [.github/workflows/release.yml, .github/workflows/build.yml]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_type == 'tag' && github.ref_name || format('test-{0}', github.sha) }}
      label: ${{ github.ref_type == 'tag' && github.ref_name || 'test' }}

  publish:
    name: Publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: inaba_*
          merge-multiple: true
          path: files
      - name: checksums
        run: |
          cd files
          # One for each platform, or nothing is published.
          test "$(ls | wc -l)" -eq 6
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
      - name: release
        run: |
          case "$GITHUB_REF_NAME" in *-*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" files/* --verify-tag --title "$GITHUB_REF_NAME" --generate-notes $pre
