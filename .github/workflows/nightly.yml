name: Nightly

# Builds main on every push. The archives stay on the run as artifacts; nothing is
# released. A newer push cancels the build still running for an older one.
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    paths: [.github/workflows/nightly.yml]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: plan
        run: echo "version=nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: plan
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      label: nightly
