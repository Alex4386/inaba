components:
    schemas:
        AcceptHostInviteRequest:
            type: object
            properties:
                token:
                    type: string
        AcpAgent:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                version:
                    type: string
                icon:
                    type: string
                    description: An image URL.
                website:
                    type: string
                command:
                    type: array
                    items:
                        type: string
                    description: |-
                        How to start it, through npx or uvx. Empty for an agent published only as a
                         download, which inaba does not fetch; install it and enter its command instead.
                env:
                    type: object
                    additionalProperties:
                        type: string
        ApproveHostLoginRequest:
            type: object
            properties:
                user_code:
                    type: string
                name:
                    type: string
                    description: The host's name; the machine's suggestion when empty.
                shared:
                    type: boolean
        ArchivePolicy:
            type: object
            properties:
                after_days:
                    type: integer
                    format: uint32
            description: |-
                A thread nothing happened in for this many days is archived, unless it is pinned or
                 working; 0 never archives by itself. A host that never set it uses 3. Archiving hides
                 it, and can be undone.
        Attachment:
            type: object
            properties:
                name:
                    type: string
                mime_type:
                    type: string
                data:
                    type: string
                    description: |-
                        The file itself: an image up to 5 MiB, any other file up to 10 MiB. The host
                         writes a non-image file into the thread's folder, under .inaba/uploads/, and
                         keeps only its path and size from then on, so data is empty in the event log
                         and the queue.
                    format: bytes
                path:
                    type: string
                    description: 'For a file in the thread''s folder: its path, relative to the folder. data is empty.'
                size:
                    type: string
                    description: |-
                        The uploaded file's size in bytes, once the host has written it out; unset for a
                         file that was pointed at by path.
            description: |-
                A file given to the agent with a message: an image the user added, or a file in
                 the thread's folder the message points at.
        Automation:
            type: object
            properties:
                id:
                    type: string
                    description: Set by the host.
                name:
                    type: string
                enabled:
                    type: boolean
                    description: A turned-off automation does not run on its schedule or from its webhook.
                schedule:
                    allOf:
                        - $ref: '#/components/schemas/Schedule'
                    description: When it runs by itself; unset for one that runs from its webhook or by hand.
                webhook:
                    type: boolean
                    description: Whether calling its webhook runs it.
                prompt:
                    type: string
                    description: |-
                        The message each run sends. {{payload}} stands for the body the webhook was
                         called with, and {{time}} for when the run started. A webhook body the message
                         has no place for is added at its end.
                thread_id:
                    type: string
                    description: 'Where the message goes: this thread, behind whatever it is doing...'
                new_thread:
                    allOf:
                        - $ref: '#/components/schemas/NewThread'
                    description: '...or, with thread_id empty, a thread made for each run.'
                next_run:
                    type: string
                    description: When it runs next on its schedule. Set by the host.
                    format: date-time
                runs:
                    type: array
                    items:
                        $ref: '#/components/schemas/AutomationRun'
                    description: The latest runs, newest first. Set by the host.
                created_at:
                    type: string
                    format: date-time
        AutomationRun:
            type: object
            properties:
                time:
                    type: string
                    format: date-time
                trigger:
                    type: string
                    description: schedule, webhook or manual.
                thread_id:
                    type: string
                    description: The thread the message went to.
                error:
                    type: string
                    description: Why the run did not get its message sent.
        BeginPasskeyRequest:
            type: object
            properties: {}
            description: |-
                WebAuthn options and responses travel as the JSON the browser's
                 PublicKeyCredential.parse*OptionsFromJSON and toJSON read and write.
        BeginPasskeyResponse:
            type: object
