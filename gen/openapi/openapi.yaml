                compact_database:
                    type: boolean
                    description: Give the space deleted data leaves back to the file system.
        ClearSnoozeResponse:
            type: object
            properties: {}
        CloseBrowserResponse:
            type: object
            properties: {}
        CloseHostTerminalResponse:
            type: object
            properties: {}
        CloseShellRequest:
            type: object
