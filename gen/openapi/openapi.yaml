                        The code from the authenticator app, for an account with two-step sign-in on.
                         Without it such an account is refused with FAILED_PRECONDITION, asking for it.
        LoginSession:
            type: object
            properties:
                id:
                    type: string
                user_agent:
                    type: string
                    description: The browser it was made in, as it named itself.
                created_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
                current:
                    type: boolean
                    description: The sign-in this request came with.
        LogoutResponse:
            type: object
            properties: {}
        MarkThreadSeenRequest:
            type: object
            properties:
                host_id:
                    type: string
                thread_id:
                    type: string
                    description: The thread's id on the host; at most 64 characters.
                seq:
                    type: string
                    description: The seq of the last event read, such as the thread's last_seq when it was shown.
        McpServer:
            type: object
            properties:
                id:
                    type: string
                    description: Set by the host.
                name:
                    type: string
                    description: What the agent knows it by.
                enabled:
                    type: boolean
                command:
                    type: string
                args:
                    type: array
                    items:
                        type: string
                env:
                    type: object
                    additionalProperties:
                        type: string
                url:
                    type: string
                headers:
                    type: object
                    additionalProperties:
                        type: string
                project_ids:
                    type: array
                    items:
                        type: string
                    description: The projects whose threads get it; empty for every thread.
                created_at:
                    type: string
                    format: date-time
            description: |-
                An MCP server: a command the agent starts, or an address it reaches over
                 Streamable HTTP. Exactly one of command and url is set.
        ModeChanged:
            type: object
            properties:
                mode:
                    type: integer
                    format: enum
        Module:
            type: object
            properties:
                name:
                    type: string
                title:
                    type: string
                description:
                    type: string
                enabled:
                    type: boolean
                error:
                    type: string
                    description: Why it could not start when it is enabled but not running.
        MoveQueuedRequest:
            type: object
            properties:
                thread_id:
                    type: string
                queued_id:
                    type: string
                to_index:
                    type: integer
                    description: Its place afterwards, 0 being next; past the end puts it last.
                    format: uint32
        NavigateRequest:
            type: object
            properties:
                thread_id:
                    type: string
                page_id:
                    type: string
                    description: Empty for the newest page.
                url:
                    type: string
                    description: An address to go to.
                action:
                    type: string
                    description: back, forward, reload or close, instead of an address. close shuts the page.
                new_page:
                    type: boolean
                    description: Open url in a new page.
        NewThread:
            type: object
            properties:
                provider:
                    type: string
                project_id:
                    type: string
                    description: The project to start it in; empty to start it in the cwd below.
                cwd:
                    type: string
                worktree:
                    type: boolean
                    description: Give each run's thread its own worktree, as CreateThread does.
                options:
                    type: object
                    additionalProperties:
                        type: string
        NewThreadDefaults:
            type: object
            properties:
                provider:
                    type: string
                    description: A provider id; empty leaves it to the picker.
                options:
                    type: object
                    additionalProperties:
                        type: string
                    description: Session option values for that provider, by option id, such as model and effort.
                worktree:
                    type: boolean
                    description: Start new threads in a worktree of their own rather than the project's folder.
            description: The choices a new thread in a project starts with; each can still be changed there.
        NotificationChannel:
            type: object
            properties:
                id:
                    type: string
                    description: Set by the server.
                kind:
                    type: string
                    description: '"webhook", "ntfy", "discord", "slack" or "telegram": which of config is set. Set by the server.'
                label:
                    type: string
                    description: What to call it; at most 64 characters.
                webhook:
                    $ref: '#/components/schemas/WebhookChannel'
                ntfy:
                    $ref: '#/components/schemas/NtfyChannel'
                discord:
                    $ref: '#/components/schemas/DiscordChannel'
                slack:
                    $ref: '#/components/schemas/SlackChannel'
                telegram:
                    $ref: '#/components/schemas/TelegramChannel'
                events:
                    type: array
                    items:
                        type: string
                    description: |-
                        Which events to send: turn.ended (a turn finished), turn.failed (it ended in an
                         error), input.needed (the agent waits for an answer). Empty for all of them.
                automations_only:
                    type: boolean
                    description: Only for threads automations started.
                enabled:
                    type: boolean
                    description: A channel turned off is sent nothing but tests. CreateChannel ignores it.
                created_at:
                    type: string
                    format: date-time
                last_delivery:
                    allOf:
                        - $ref: '#/components/schemas/ChannelDelivery'
                    description: How the latest delivery went; unset until one was tried. Set by the server.
        NtfyChannel:
            type: object
            properties:
                server_url:
                    type: string
                    description: The ntfy server, such as https://ntfy.sh.
                topic:
                    type: string
                access_token:
                    type: string
                    description: Optional; write-only.
        OnboardRequest:
            type: object
            properties:
                token:
                    type: string
                username:
                    type: string
                password:
                    type: string
                    description: At least 8 characters.
        OpenBrowserRequest:
            type: object
            properties:
                thread_id:
                    type: string
        OpenHostTerminalRequest:
            type: object
            properties:
                cwd:
                    type: string
                cols:
                    type: integer
                    description: The viewer's terminal size, so the first screen is drawn for it. Zero means 80 by 24.
                    format: uint32
                rows:
                    type: integer
                    format: uint32
        OptionsChanged:
            type: object
            properties:
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/SessionOption'
            description: The options the agent offers, or their values, changed.
        Passkey:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                created_at:
                    type: string
                    format: date-time
                last_used_at:
                    type: string
                    format: date-time
        PendingHostInvite:
            type: object
            properties:
                id:
                    type: string
                role:
                    type: string
                    description: '"member" or "manager".'
                note:
                    type: string
                created_by:
                    type: string
                    description: Who made it, by name; empty when that account is gone.
                created_at:
                    type: string
                    format: date-time
                expires_at:
                    type: string
                    format: date-time
        PermissionRequest:
            type: object
            properties:
                request_id:
                    type: string
                title:
                    type: string
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/PermissionRequest_Option'
                raw:
                    $ref: '#/components/schemas/GoogleProtobufValue'
        PermissionRequest_Option:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                kind:
                    type: string
                    description: The provider's own word for it, such as allow_once or reject_always.
        PermissionResolved:
            type: object
            properties:
                request_id:
                    type: string
                option_id:
                    type: string
                    description: Empty when the request was cancelled.
        Plan:
            type: object
            properties:
                entries:
                    type: array
                    items:
                        $ref: '#/components/schemas/Plan_Entry'
            description: The agent's plan for the turn, whole each time it changes.
        Plan_Entry:
            type: object
            properties:
                content:
                    type: string
                priority:
                    type: string
                    description: high, medium or low.
                status:
                    type: string
                    description: pending, in_progress or completed.
        PollHostLoginRequest:
            type: object
            properties:
                device_code:
                    type: string
        PollHostLoginResponse:
            type: object
            properties:
                pending:
                    type: boolean
                    description: Still waiting for the user. A denied or expired login is an error instead.
                host:
                    $ref: '#/components/schemas/Host'
                refresh_token:
                    type: string
                    description: Kept by the host for good, until the host is removed; trade it for access tokens.
        Presence:
            type: object
            properties:
                user_id:
                    type: string
                name:
                    type: string
                avatar_url:
                    type: string
                    description: See User.avatar_url.
                thread_id:
                    type: string
                project_id:
                    type: string
                seen_at:
                    type: string
                    format: date-time
                clients:
                    type: array
                    items:
                        type: string
                    description: Their browser tabs' client ids there, to tell who holds a thread's driver seat.
                terminal_id:
                    type: string
                    description: The host terminal they have open, if any; see HeartbeatRequest.terminal_id.
        Project:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                cwd:
                    type: string
                    description: Where the project's threads start.
                created_at:
                    type: string
                    format: date-time
                icon:
                    type: string
                    description: 'A picture for it, as a data: URL; empty shows its initials.'
                pinned:
                    type: boolean
                    description: Pinned projects come first in the sidebar, for everyone.
                new_thread:
                    allOf:
                        - $ref: '#/components/schemas/NewThreadDefaults'
                    description: What a new thread in the project starts with.
                archived:
                    type: boolean
                    description: 'Put away: left out of the sidebar until someone asks to see what is archived.'
            description: A folder on the host that threads are grouped under.
        Provider:
            type: object
            properties:
                id:
                    type: string
                terminal:
                    type: boolean
                    description: Whether threads can switch to THREAD_MODE_TERMINAL.
                raw:
                    type: boolean
                    description: Whether Raw is available.
                structured:
                    type: boolean
                    description: |-
                        Whether threads have a structured mode. A provider without one, such as a plain
                         shell, only ever runs in THREAD_MODE_TERMINAL.
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/SessionOption'
                    description: |-
                        The session options this provider's agent offered the last time one of its
                         threads ran on this host, for choosing before a thread exists. Empty until then.
                display_name:
                    type: string
                    description: What to call the provider; the id when the config gives no name.
                icon:
                    type: string
                    description: An image URL for it, from the ACP registry entry its command runs; empty when none matches.
        ProviderChanged:
            type: object
            properties:
                provider:
                    type: string
                from:
                    type: string
            description: The thread moved to another provider's agent.
        ProviderConfig:
            type: object
            properties:
                id:
                    type: string
                    description: Lowercase letters, digits, - and _. Threads record it, so renaming is adding anew.
                display_name:
                    type: string
                enabled:
                    type: boolean
                    description: A disabled provider is not offered for new threads; its threads still run.
                command:
                    type: array
                    items:
                        type: string
                    description: Starts the agent speaking ACP on stdio.
                terminal:
                    type: array
                    items:
                        type: string
                    description: Starts the agent's own interactive CLI; empty leaves terminal mode out.
                terminal_resume:
                    type: array
                    items:
                        type: string
                    description: Continues a session in the CLI; "{session}" becomes the agent's session id.
                env:
                    type: object
                    additionalProperties:
                        type: string
                builtin:
                    type: boolean
                    description: |-
                        Built into inaba, like the plain shell: only its name and whether it is
                         offered can change, and it cannot be removed.
                hidden_models:
                    type: array
                    items:
                        type: string
                    description: Models left out of the pickers, by value; a thread already on one keeps it.
                status:
                    allOf:
                        - $ref: '#/components/schemas/ProviderStatus'
                    description: Filled in by the host when read, never saved.
                models:
                    type: array
                    items:
                        $ref: '#/components/schemas/SessionOption_Choice'
                    description: The models the agent offered the last time one of its threads ran here.
                icon:
                    type: string
                    description: |-
                        A picture chosen for it, as a data: URL of an image of at most 128 KiB; empty
                         shows the ACP registry's icon for the agent it runs.
        ProviderStatus:
            type: object
            properties:
                ok:
                    type: boolean
                name:
                    type: string
                    description: What the agent calls itself, and its version.
                version:
                    type: string
                error:
                    type: string
                    description: Why it did not start.
                checked_at:
                    type: string
                    format: date-time
            description: Whether a provider's agent starts, from the last check.
        PushDevice:
            type: object
            properties:
                id:
                    type: string
                platform:
                    type: integer
                    format: enum
                label:
                    type: string
                created_at:
                    type: string
                    format: date-time
                last_used_at:
                    type: string
                    description: When a notification last reached it; unset until one has.
                    format: date-time
                endpoint:
                    type: string
                    description: The endpoint, so a browser can find its own subscription in the list.
        QueuedAttachmentsEdit:
            type: object
            properties:
                keep:
                    type: array
                    items:
                        type: integer
                        format: uint32
                    description: Indexes into the message's current attachments, in increasing order.
                add:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                    description: New attachments, checked and stored as StartTurn's are.
                seen:
                    type: array
                    items:
                        type: string
                    description: |-
                        The names of the message's attachments that keep indexes into, as the client saw
                         them; the edit is refused if the message's attachments have changed since.
            description: |-
                What a queued message's attachments become: those of its current ones it keeps, then
                 new ones. The kept ones go by index, so a client never has to send back bytes it holds.
        QueuedMessage:
            type: object
            properties:
                id:
                    type: string
                text:
                    type: string
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                resume:
                    type: boolean
                    description: As UserMessage.resume.
        RawEvent:
            type: object
            properties:
                method:
                    type: string
                params:
                    $ref: '#/components/schemas/GoogleProtobufValue'
            description: A provider notification inaba has no event for, passed through unchanged.
        RawRequest:
            type: object
            properties:
                thread_id:
                    type: string
                method:
                    type: string
                params:
                    $ref: '#/components/schemas/GoogleProtobufValue'
        RawResponse:
            type: object
            properties:
                result:
                    $ref: '#/components/schemas/GoogleProtobufValue'
        ReadFileResponse:
            type: object
            properties:
                data:
                    type: string
                    format: bytes
                mime_type:
                    type: string
                    description: What the content looks like, such as text/plain; charset=utf-8 or image/png.
                size:
                    type: string
                truncated:
                    type: boolean
                    description: The file is larger than what is sent, which is its beginning.
                version:
                    type: string
                    description: Names the content, to save it back with WriteFile only if it is still this.
        RefreshHostTokenRequest:
            type: object
            properties:
                refresh_token:
                    type: string
        RefreshHostTokenResponse:
            type: object
            properties:
                access_token:
                    type: string
                expires_at:
                    type: string
                    format: date-time
        RegisterDeviceRequest:
            type: object
            properties:
                platform:
                    type: integer
                    format: enum
                endpoint:
                    type: string
                    description: For the web, the subscription's https endpoint, on a known push service.
                p256dh:
                    type: string
                    description: 'For the web, the subscription''s keys, base64url: a 65-byte P-256 key and a 16-byte secret.'
                auth:
                    type: string
                label:
                    type: string
                    description: What to call the device, such as "Chrome on macOS"; at most 64 characters.
        RemoveHostMemberResponse:
            type: object
            properties: {}
        RenameHostTerminalRequest:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
        ResizeHostTerminalRequest:
            type: object
            properties:
                id:
                    type: string
                cols:
                    type: integer
                    format: uint32
                rows:
                    type: integer
                    format: uint32
        ResizeHostTerminalResponse:
            type: object
            properties: {}
        ResizeRequest:
            type: object
            properties:
                thread_id:
                    type: string
                cols:
                    type: integer
                    format: uint32
                rows:
                    type: integer
                    format: uint32
        ResizeResponse:
            type: object
            properties: {}
        ResizeShellRequest:
            type: object
            properties:
                thread_id:
                    type: string
                cols:
                    type: integer
                    format: uint32
                rows:
                    type: integer
                    format: uint32
                shell_id:
                    type: string
        ResizeShellResponse:
            type: object
            properties: {}
        RespondRequest:
            type: object
            properties:
                thread_id:
                    type: string
                request_id:
                    type: string
                option_id:
                    type: string
                    description: Leave empty to cancel the request.
        RespondResponse:
            type: object
            properties: {}
        RestartHostRequest:
            type: object
            properties: {}
        RestartHostResponse:
            type: object
            properties: {}
        RevokeHostInviteResponse:
            type: object
            properties: {}
        RevokeHostInvitesRequest:
            type: object
            properties:
                host_id:
                    type: string
        RevokeHostInvitesResponse:
            type: object
            properties: {}
        RevokeSessionResponse:
            type: object
            properties: {}
        RevokeTokenResponse:
            type: object
            properties: {}
        RewindRequest:
            type: object
            properties:
                thread_id:
                    type: string
                seq:
                    type: string
                    description: The seq of the UserMessage event to go back to before.
                restore_files:
                    type: boolean
                    description: |-
                        Also put the files back as they were before that message's turn. Only for a
                         thread with a worktree of its own, as with GitService.Restore.
        RewindResponse:
            type: object
            properties:
                thread:
                    $ref: '#/components/schemas/Thread'
                message:
                    allOf:
                        - $ref: '#/components/schemas/UserMessage'
                    description: The message that was taken back.
        Rewound:
            type: object
            properties:
                to_seq:
                    type: string
            description: |-
                The conversation was taken back to before the message at to_seq: the events from
                 to_seq up to this one are no longer part of it.
        RotateWebhookSecretResponse:
            type: object
            properties:
                webhook_secret:
                    type: string
        RunAutomationRequest:
            type: object
            properties:
                id:
                    type: string
        Schedule:
            type: object
            properties:
                every_minutes:
                    type: integer
                    format: uint32
                daily:
                    $ref: '#/components/schemas/Daily'
                once_at:
                    type: string
                    format: date-time
        SearchFilesResponse:
            type: object
            properties:
                paths:
                    type: array
                    items:
                        type: string
                    description: Paths relative to the thread's folder, best match first; at most 50.
        SearchHit:
            type: object
            properties:
                thread_id:
                    type: string
                seq:
                    type: string
                    description: 'The message''s event: a user message''s, or the first text of an agent''s answer.'
                kind:
                    type: string
                    description: '"user" or "assistant".'
                snippet:
                    type: string
                    description: |-
                        The text around the match, on one line, and where the match is in it, in UTF-16
                         code units as a browser counts them.
                match_start:
                    type: integer
                    format: uint32
                match_end:
                    type: integer
                    format: uint32
                time:
                    type: string
                    format: date-time
            description: A message that says what was searched for.
        SearchThreadsResponse:
            type: object
            properties:
                hits:
                    type: array
                    items:
                        $ref: '#/components/schemas/SearchHit'
        ServerHousekeeping:
            type: object
            properties:
                database_bytes:
                    type: string
                    description: The database file and its write-ahead log.
                expired_tokens:
                    type: integer
                    description: Sign-ins and tokens past their expiry. They no longer work; they only take space.
                    format: uint32
                active_sign_ins:
                    type: integer
                    description: Browser sign-ins that still work.
                    format: uint32
        SessionOption:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                description:
                    type: string
                category:
                    type: string
                    description: 'The agent''s hint at what the option is: "model", "mode", "thought_level", or its own word.'
                boolean:
                    type: boolean
                    description: 'An on/off option: value is "true" or "false" and there are no choices.'
                value:
                    type: string
                    description: The current value.
                choices:
                    type: array
                    items:
                        $ref: '#/components/schemas/SessionOption_Choice'
            description: |-
                A setting of the thread that the agent itself offers: which model, which
                 permission mode, how hard to think. inaba does not know these ahead of time; it
                 shows whatever the agent reports.
        SessionOption_Choice:
            type: object
            properties:
                value:
                    type: string
                name:
                    type: string
                description:
                    type: string
                group:
                    type: string
                    description: A heading the agent files the choice under; empty when it does not group them.
        SetAccessRequest:
            type: object
            properties:
                user:
                    type: string
                    description: 'The account: its id, or the name of a password account.'
                admin:
                    type: boolean
                permissions:
                    type: array
                    items:
                        type: integer
                        format: enum
        SetHostMemberRequest:
            type: object
            properties:
                host_id:
                    type: string
                user_id:
                    type: string
                role:
                    type: string
                    description: '"member" or "manager"; "none" takes the account out.'
        SetHostMemberResponse:
            type: object
            properties: {}
        SetLayoutRequest:
            type: object
            properties:
                thread_id:
                    type: string
                layout:
                    type: string
                    description: At most 16 KiB, written and read by the web UI.
        SetModeRequest:
            type: object
            properties:
                thread_id:
                    type: string
                mode:
                    type: integer
                    format: enum
        SetModuleRequest:
            type: object
            properties:
                name:
                    type: string
                enabled:
                    type: boolean
        SetOptionRequest:
            type: object
            properties:
                thread_id:
                    type: string
                option_id:
                    type: string
                value:
                    type: string
                    description: One of the option's choices, or "true"/"false" for an on/off option.
        SetPasswordRequest:
            type: object
            properties:
                user:
                    type: string
                    description: 'The account: its id, or the name of a password account.'
                password:
                    type: string
        SetPasswordResponse:
            type: object
            properties: {}
        SlackChannel:
            type: object
            properties:
                webhook_url:
                    type: string
                    description: https://hooks.slack.com/...; write-only.
        Snooze:
            type: object
            properties:
                host_id:
                    type: string
                kind:
                    type: integer
                    format: enum
                target_id:
                    type: string
                    description: The project's or thread's id on the host; at most 64 characters.
                until:
                    type: string
                    description: When it wakes; unset for never.
                    format: date-time
        StartHostLoginRequest:
            type: object
            properties:
                name:
                    type: string
                    description: The name the machine suggests for itself, usually its hostname.
        StartHostLoginResponse:
            type: object
            properties:
                device_code:
                    type: string
                    description: The host's secret for polling; never shown to anyone.
                user_code:
                    type: string
                    description: What the user checks in the browser, such as BCDF-GHJK.
                verification_uri:
                    type: string
                    description: Where to approve, and the same with the code filled in.
                verification_uri_complete:
                    type: string
                interval_seconds:
                    type: integer
                    format: int32
                expires_at:
                    type: string
                    format: date-time
        StartTurnRequest:
            type: object
            properties:
                thread_id:
                    type: string
                text:
                    type: string
                interrupt:
                    type: boolean
                    description: When a turn is running, stop it and run this message next, ahead of the queue.
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
        StartTurnResponse:
            type: object
            properties:
                queued_id:
                    type: string
                    description: Set when the message was queued instead of started.
        Status:
            type: object
            properties:
                code:
                    type: integer
                    description: The status code, which should be an enum value of [google.rpc.Code][google.rpc.Code].
                    format: int32
                message:
                    type: string
                    description: A developer-facing error message, which should be in English. Any user-facing error message should be localized and sent in the [google.rpc.Status.details][google.rpc.Status.details] field, or localized by the client.
                details:
                    type: array
                    items:
                        $ref: '#/components/schemas/GoogleProtobufAny'
                    description: A list of messages that carry the error details.  There is a common set of message types for APIs to use.
            description: 'The `Status` type defines a logical error model that is suitable for different programming environments, including REST APIs and RPC APIs. It is used by [gRPC](https://github.com/grpc). Each `Status` message contains three pieces of data: error code, error message, and error details. You can find out more about this error model and how to work with it in the [API Design Guide](https://cloud.google.com/apis/design/errors).'
        SystemInfo:
            type: object
            properties:
                hostname:
                    type: string
                platform:
                    type: string
                    description: The system and its version as it names them, such as "macOS 26.2".
                kernel:
                    type: string
                arch:
                    type: string
                cpu_model:
                    type: string
                cpu_cores:
                    type: integer
                    format: int32
                cpu_percent:
                    type: number
                    description: Busy share of all cores over the last moment, 0 to 100.
                    format: double
                load1:
                    type: number
                    format: double
                load5:
                    type: number
                    format: double
                load15:
                    type: number
                    format: double
                memory_total:
                    type: string
                memory_used:
                    type: string
                disk_total:
                    type: string
                    description: 'The disk holding the host''s data: its threads'' worktrees and snapshots.'
                disk_used:
                    type: string
                uptime_seconds:
                    type: string
                threads:
                    type: integer
                    description: Threads this host has loaded, and how many are working right now.
                    format: int32
                threads_running:
                    type: integer
                    format: int32
                inaba_version:
                    type: string
                    description: The version of inaba the host runs.
        TelegramChannel:
            type: object
            properties:
                bot_token:
                    type: string
                    description: From @BotFather; write-only.
                chat_id:
                    type: string
        TestChannelRequest:
            type: object
            properties:
                id:
                    type: string
        TestDeviceRequest:
            type: object
            properties:
                id:
                    type: string
        TestDeviceResponse:
            type: object
            properties: {}
        TextDelta:
            type: object
            properties:
                kind:
                    type: integer
                    format: enum
                text:
                    type: string
        Thread:
            type: object
            properties:
                id:
                    type: string
                provider:
                    type: string
                cwd:
                    type: string
                title:
                    type: string
                    description: What the thread is about. Left empty, it becomes the start of the first message.
                mode:
                    type: integer
                    format: enum
                status:
                    type: integer
                    format: enum
                native_session_id:
                    type: string
                    description: The provider's own thread id, once it has one.
                last_seq:
                    type: string
                created_at:
                    type: string
                    format: date-time
                project_id:
                    type: string
                    description: The project the thread belongs to; empty for a thread started outside any project.
                updated_at:
                    type: string
                    description: 'When the conversation last moved: the time of the event at activity_seq.'
                    format: date-time
                activity:
                    type: string
                    description: What the agent is doing right now, such as the tool call in progress; empty when idle.
                queue:
                    type: array
                    items:
                        $ref: '#/components/schemas/QueuedMessage'
                    description: Messages sent while a turn was running, in the order they will run.
                queue_paused:
                    type: boolean
                    description: 'The queue is waiting for a go-ahead: the user stopped a turn, or the host restarted.'
                options:
                    type: array
                    items:
                        $ref: '#/components/schemas/SessionOption'
                    description: What the agent lets the user choose for this thread, such as the model.
                worktree:
                    type: boolean
                    description: |-
                        The thread works in a git worktree of its own, on its own branch, instead of in
                         its project's folder. Deleting the thread removes the worktree when it is clean.
                commands:
                    type: array
                    items:
                        $ref: '#/components/schemas/Command'
                    description: The slash commands the agent takes, as it last reported them.
                usage:
                    allOf:
                        - $ref: '#/components/schemas/Usage'
                    description: How full the agent's context window is, when the agent reports it.
                rewound:
                    type: boolean
                    description: |-
                        The conversation was rewound. The agent cannot forget turns, so the next turn
                         starts a new agent session and hands it the conversation as it now stands.
                handoff_from:
                    type: string
                    description: |-
                        The provider the thread switched away from, until its next turn: that turn starts the new
                         provider's agent and hands it the conversation so far.
                labels:
                    type: object
                    additionalProperties:
                        type: string
                    description: |-
                        Notes modules keep on the thread, by key, such as "automation": the automation
                         that started it. Set by modules; the host keeps them with the thread.
                layout:
                    type: string
                    description: |-
                        What the thread's screen shows beside the conversation, as the web UI writes it:
                         its docks and their tabs. Shared, so everyone in the thread sees the same screen.
                named:
                    type: boolean
                    description: |-
                        Whether someone named the thread; until then the agent's own name for it, when it
                         gives one, replaces the first message as its title.
                last_turn_failed:
                    type: boolean
                    description: |-
                        The last turn ended with an error. Set when such a turn ends, cleared when the next
                         one starts. A flag beside status, not a status of its own, so clients that treat
                         anything but IDLE as busy keep working.
                activity_seq:
                    type: string
                    description: |-
                        The seq of the newest conversation event: messages, agent output, tool calls, turns,
                         permissions, rewinds. Bookkeeping such as layout, options, usage, commands, mode,
                         provider and title changes moves last_seq but not this, so opening a thread or moving
                         a tab does not make it unread or recent. 0 until the conversation starts. Resume
                         streams with last_seq; compare seen marks with this.
                background_agents:
                    type: integer
                    description: |-
                        How many agents of background workflows its agent started are still running. The
                         thread is still at work while this is above 0, even with its turn over.
                    format: uint32
        ThreadSeen:
            type: object
            properties:
                thread_id:
                    type: string
                seq:
                    type: string
        ThreadTitle:
            type: object
            properties:
                title:
                    type: string
            description: |-
                The agent named the thread. It becomes the thread's title unless someone named it
                 themselves; see Thread.named.
        Token:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                created_at:
                    type: string
                    format: date-time
        ToolCall:
            type: object
            properties:
                id:
                    type: string
                title:
                    type: string
                kind:
                    type: string
                status:
                    type: string
                raw:
                    allOf:
                        - $ref: '#/components/schemas/GoogleProtobufValue'
                    description: The provider's own record of the call.
                input:
                    type: string
                    description: |-
                        What the tool was given, for a person to read: a command's command line, or
                         the input as JSON. An update without it leaves it as it was.
                output:
                    type: string
                    description: |-
                        What the tool gave back as text, cut at 64 KiB. An update without it leaves it
                         as it was.
                agents:
                    type: array
                    items:
                        $ref: '#/components/schemas/WorkflowAgent'
                    description: |-
                        The agents a background workflow started by this call has spawned, all of them as
                         they last stood. An update without it leaves them as they were.
            description: Sent again with the same id whenever the call changes; later fields win.
        TurnChanges:
            type: object
            properties:
                before:
                    type: string
                after:
                    type: string
                files:
                    type: integer
                    format: uint32
                additions:
                    type: integer
                    format: uint32
                deletions:
                    type: integer
                    format: uint32
            description: |-
                What a turn changed in the thread's folder, as two snapshots of it: one taken
                 before the turn and one after. Sent after TurnEnded, and only when the folder is a
                 git repository and the snapshots differ. The snapshots are commits kept under
                 refs/inaba/checkpoints/, away from the user's branches and index.
        TurnEnded:
            type: object
            properties:
                stop_reason:
                    type: string
                    description: The provider's own stop reason, such as end_turn or cancelled.
                error:
                    type: string
                    description: Set when the turn failed.
                usage:
                    allOf:
                        - $ref: '#/components/schemas/TurnUsage'
                    description: |-
                        The tokens the turn used; unset when the agent does not say. Left out of the copies
                         a fork makes, so a turn is counted once.
                copied:
                    type: boolean
                    description: 'Set on the copies a fork makes of the original''s turns: history, not a turn the fork ran.'
        TurnStarted:
            type: object
            properties: {}
        TurnUsage:
            type: object
            properties:
                input_tokens:
                    type: string
                output_tokens:
                    type: string
                cached_read_tokens:
                    type: string
                cached_write_tokens:
                    type: string
                thought_tokens:
                    type: string
                total_tokens:
                    type: string
            description: The tokens one turn used, as the agent reported them when the turn ended.
        UpdateHostRequest:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                icon:
                    type: string
                    description: |-
                        One of the web UI's icons by name, such as server or laptop; empty picks one
                         from the host's system.
                image:
                    type: string
                    description: |-
                        A picture to show instead of the icon, as a data: URL of a PNG, JPEG or WebP
                         image of at most 256 KiB; empty removes it.
                restricted:
                    type: boolean
                    description: Keeps a shared host to its members, instead of every account. For administrators.
            description: Changes what is set; a field left out stays as it is.
        UpdateProfileRequest:
            type: object
            properties:
                avatar:
                    type: string
                    description: 'A picture as a data: URL of a PNG, JPEG or WebP image of at most 256 KiB; empty removes it.'
                display_name:
                    type: string
                    description: Up to 64 characters; empty goes back to the sign-in name.
                stealth:
                    type: boolean
                    description: 'Stealth mode, for administrators only: see User.stealth.'
        UpdateProjectRequest:
            type: object
            properties:
                project_id:
                    type: string
                name:
                    type: string
                icon:
                    type: string
                pinned:
                    type: boolean
                new_thread:
                    $ref: '#/components/schemas/NewThreadDefaults'
                archived:
                    type: boolean
        UpdateThreadRequest:
            type: object
            properties:
                thread_id:
                    type: string
                title:
                    type: string
                pinned:
                    type: boolean
                    description: Pins the thread to the top of its project for everyone, kept as the "pinned" label.
                archived:
                    type: boolean
                    description: Puts the thread away, out of the sidebar until archived ones are shown; kept as the "archived" label.
                provider:
                    type: string
                    description: |-
                        Moves the thread to another provider's agent while it is idle. The new agent does not share the
                         old one's memory, so its first turn is handed the conversation so far.
            description: Changes what is set; a field left out stays as it is.
        UpgradeHostRequest:
            type: object
            properties:
                channel:
                    type: string
                    description: '"release", "pre-release" or "nightly"; empty for the one the running build came from.'
                use_gh:
                    type: boolean
                    description: |-
                        Nightly builds are GitHub Actions artifacts, which the host fetches with the gh CLI
                         and so with the GitHub account signed in to it there. Set to agree to that; a
                         nightly is refused without it.
        UpgradeHostResponse:
            type: object
            properties:
                from:
                    type: string
                    description: |-
                        The version it ran, and the one it runs after restarting; the same when it was
                         the newest already.
                to:
                    type: string
                updated:
                    type: boolean
                channel:
                    type: string
        Usage:
            type: object
            properties:
                used:
                    type: string
                    description: Tokens in the context window now, and how many it holds.
                size:
                    type: string
                cost:
                    type: number
                    description: What the thread has cost so far; zero when the agent does not say.
                    format: double
                currency:
                    type: string
                    description: ISO 4217, such as USD.
                limits:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageLimit'
                    description: |-
                        The provider's rate-limit or quota windows, when its agent reports them. ACP has no
                         message for these yet, so no agent fills them today.
        UsageChanged:
            type: object
            properties:
                usage:
                    $ref: '#/components/schemas/Usage'
        UsageLimit:
            type: object
            properties:
                name:
                    type: string
                    description: What the provider calls the window, such as "5h" or "weekly".
                used_fraction:
                    type: number
                    description: How much of the window is used, 0 to 1.
                    format: double
                resets_at:
                    type: string
                    description: When the window starts over; unset when the provider does not say.
                    format: date-time
            description: One rate-limit or quota window of a provider, such as a five-hour or weekly limit.
        UsageSummary:
            type: object
            properties:
                from:
                    type: string
                    description: The window as applied, after defaults and the cap.
                    format: date-time
                to:
                    type: string
                    format: date-time
                currency:
                    type: string
                    description: ISO 4217 code of every cost here; empty when no agent reported a cost.
                totals:
                    $ref: '#/components/schemas/UsageTotals'
                days:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageSummary_Day'
                    description: Every day of the window, oldest first, including days with nothing.
                providers:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageSummary_Group'
                    description: By provider and by project, most cost first.
                projects:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageSummary_Group'
                top_threads:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageSummary_ThreadUsage'
                    description: The threads that used most, by cost and then tokens; at most 10.
                limits:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageSummary_ProviderLimits'
                    description: The latest limit windows of each provider whose agent reports them.
        UsageSummary_Day:
            type: object
            properties:
                date:
                    type: string
                    description: YYYY-MM-DD in the host's local time.
                totals:
                    $ref: '#/components/schemas/UsageTotals'
                providers:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageSummary_Group'
                    description: The same day by provider, most cost first, so a chart can stack them.
        UsageSummary_Group:
            type: object
            properties:
                id:
                    type: string
                    description: A provider id, or a project id; empty for threads outside any project.
                totals:
                    $ref: '#/components/schemas/UsageTotals'
        UsageSummary_ProviderLimits:
            type: object
            properties:
                provider:
                    type: string
                limits:
                    type: array
                    items:
                        $ref: '#/components/schemas/UsageLimit'
                reported_at:
                    type: string
                    description: When the agent last reported them.
                    format: date-time
        UsageSummary_ThreadUsage:
            type: object
            properties:
                thread_id:
                    type: string
                title:
                    type: string
                project_id:
                    type: string
                provider:
                    type: string
                    description: The provider the thread uses now.
                totals:
                    $ref: '#/components/schemas/UsageTotals'
        UsageTotals:
            type: object
            properties:
                cost:
                    type: number
                    description: What the agents reported spending, in UsageSummary.currency.
                    format: double
                input_tokens:
                    type: string
                output_tokens:
                    type: string
                cached_read_tokens:
                    type: string
                cached_write_tokens:
                    type: string
                thought_tokens:
                    type: string
                total_tokens:
                    type: string
                turns:
                    type: integer
                    description: Turns that ended in the window.
                    format: uint32
                threads:
                    type: integer
                    description: Threads with a turn or reported spend in the window.
                    format: uint32
        User:
            type: object
            properties:
                id:
                    type: string
                name:
                    type: string
                oidc:
                    type: boolean
                    description: Whether the account signs in through OIDC rather than with a password.
                admin:
                    type: boolean
                    description: An administrator has every permission and manages the other accounts.
                permissions:
                    type: array
                    items:
                        type: integer
                        format: enum
                avatar_url:
                    type: string
                    description: |-
                        Where the account's picture is served, for anyone signed in; empty without one.
                         It changes when the picture does, so it can be cached.
                display_name:
                    type: string
                    description: What to call the person; the name they sign in with when empty.
                totp:
                    type: boolean
                    description: Whether signing in also asks for a code from an authenticator app.
                stealth:
                    type: boolean
                    description: An administrator in stealth mode is left out of what others see of who is where.
        UserDetail:
            type: object
            properties:
                user:
                    $ref: '#/components/schemas/User'
                created_at:
                    type: string
                    format: date-time
                sessions:
                    type: integer
                    description: Browsers signed in now, and passkeys registered.
                    format: int32
                passkeys:
                    type: integer
                    format: int32
                hosts:
                    type: array
                    items:
                        $ref: '#/components/schemas/HostAccess'
                    description: Every host, with the account's place on it.
        UserMessage:
            type: object
            properties:
                text:
                    type: string
                attachments:
                    type: array
                    items:
                        $ref: '#/components/schemas/Attachment'
                resume:
                    type: boolean
                    description: 'Written by inaba, not a person: it carries on a turn the host''s restart cut short.'
        WebhookChannel:
            type: object
            properties:
                url:
                    type: string
                    description: An http or https address.
        WorkflowAgent:
            type: object
            properties:
                id:
                    type: string
                label:
                    type: string
                    description: The workflow's name for it, and the phase it belongs to.
                phase:
                    type: string
                done:
                    type: boolean
                activity:
                    type: string
                    description: 'What it is doing now, as its latest tool call: "Bash: go test ./...".'
                result:
                    type: string
                    description: What it returned, cut short, once done.
                started_at:
                    type: string
                    description: When it started, and when it finished or was stopped; the latter unset while it runs.
                    format: date-time
                ended_at:
                    type: string
                    format: date-time
                stopped:
                    type: boolean
                    description: 'It never finished: its session closed, or it wrote nothing for a long while.'
            description: One agent of a background workflow, such as Claude Code's ultracode runs.
        WorkflowStep:
            type: object
            properties:
                kind:
                    type: string
                    description: 'prompt: the task it was given; text: what it said; tool: a tool call it made.'
                text:
                    type: string
                tool:
                    type: string
                    description: |-
                        For a tool call: the tool, what it was given in brief, what it gave back (cut short),
                         and whether that was an error.
                input:
                    type: string
                output:
                    type: string
                failed:
                    type: boolean
            description: One step of a workflow agent's own conversation.
        Worktree:
            type: object
            properties:
                branch:
                    type: string
                    description: |-
                        The branch to work on. Created when it does not exist. Defaults to a new branch
                         named after the thread.
                base:
                    type: string
                    description: |-
                        What a new branch starts from: a branch, tag or commit. Defaults to the
                         project folder's current commit.
        WriteFileRequest:
            type: object
            properties:
                thread_id:
                    type: string
                path:
                    type: string
                data:
                    type: string
                    format: bytes
                base_version:
                    type: string
                    description: ReadFileResponse.version as read; empty writes regardless.
        WriteFileResponse:
            type: object
            properties:
                version:
                    type: string
        WriteHostTerminalRequest:
            type: object
            properties:
                id:
                    type: string
                data:
                    type: string
                    format: bytes
        WriteHostTerminalResponse:
            type: object
            properties: {}
        WriteRequest:
            type: object
            properties:
                thread_id:
                    type: string
                data:
                    type: string
                    format: bytes
        WriteResponse:
            type: object
            properties: {}
        WriteShellRequest:
            type: object
            properties:
                thread_id:
                    type: string
                data:
                    type: string
                    format: bytes
                shell_id:
                    type: string
        WriteShellResponse:
            type: object
            properties: {}
tags:
    - name: AdminService
      description: |-
        Administration of the server's accounts, for administrators. The server's local
         control socket serves it too, to whoever can open the socket.
    - name: AuthService
    - name: AutomationService
      description: |-
        Work that starts by itself: on a schedule, or when its webhook is called. Each run
         sends a message to a thread, an existing one or one made for the run. Managing
         automations needs the permission to manage projects.

         The webhook is POST /hooks/{host_id}/{automation_id} on the server, outside the
         API: callers prove themselves with the automation's secret, as a Bearer token or
         as an X-Hub-Signature-256 HMAC of the body the way GitHub signs. A delivery id
         (X-GitHub-Delivery, X-Gitlab-Event-UUID or Idempotency-Key) seen before is not run
         again. The answer, 202, comes before the run is under way.
    - name: BrowserService
      description: |-
        Each thread has a browser of its own on the host, started when first needed. The
         thread's agent drives it through Playwright MCP, which the module gives it; people
         watch it and use it here. The two share the browser: what one does, the other sees.
         The browser keeps its profile (cookies, logins) until the thread is deleted.
    - name: FileService
      description: |-
        Reading what is in a thread's folder: finding files to point an agent at with @path,
         and showing folders and files. Nothing here writes. Paths are relative to the
         thread's folder, and never lead out of it, through .. or a symbolic link.
    - name: GitService
      description: |-
        A git repository: what changed in its working tree, and committing it.

         Each call has two addresses. A project's is the folder the project stands for. A
         thread's is the folder that thread works in. While a thread works in its project's
         own folder, the two are the same repository state, and the thread's REST address
         answers with a 307 redirect to the project's, so that state has one address. A
         thread working in a folder of its own, such as one outside any project, answers
         at its own address.
    - name: HostService
    - name: HostTerminalService
      description: |-
        Login shells on the host, each in the folder it was opened in. One runs until it is
         closed, its shell exits, or the host stops; leaving its page does not end it. They
         need the threads-anywhere permission, as a shell reaches any folder.
    - name: HousekeepingService
      description: |-
        Upkeep of a host: what inaba leaves on its disk, and clearing what is no longer
         needed. For accounts allowed to manage hosts.
    - name: McpService
      description: |-
        MCP servers the host gives the agents of its threads, on top of the agents' own.
         A thread gets the servers that apply to it when its agent starts; a change reaches
         a running thread the next time its agent is started. They hold the host's secrets
         and reach every thread on it, so reading or changing them needs the hosts
         permission, which a personal host's owner has.
    - name: ModuleService
      description: |-
        The optional parts of a host, such as automations, and turning them on and off.
         A change takes effect at once, without a restart; threads are not touched. Data
         a turned-off module keeps stays, for when it is turned on again. Listing needs no
         permission; changing needs the permission to manage hosts.
    - name: NotificationService
      description: |-
        Push notifications to the signed-in account's devices, and the threads and projects it
         has snoozed. The server keeps only the devices and the snoozes, never what a thread says.
    - name: PresenceService
      description: 'Who is where: each browser says what it has open, and hears who else is on the same host.'
    - name: ProjectService
    - name: ProviderConfigService
      description: |-
        The agents a host offers, as its config file lists them. Changes are written to
         that file and take effect for new threads at once; running ones keep what they
         started with. Reading or changing them needs the hosts permission, since the
         environment variables may hold keys.
    - name: ShellService
      description: |-
        Login shells in the thread's folder, beside the conversation, for running commands
         while the agent works. A thread has as many as the caller names by shell_id, ""
         being the first; each starts on its first Attach, and again on an Attach after it
         exits, and ends with CloseShell or the thread.
    - name: SystemService
      description: What the machine a host runs on is and how busy it is, for its About page.
    - name: TerminalService
      description: The PTY of a thread in THREAD_MODE_TERMINAL.
    - name: ThreadService
    - name: UsageService
      description: |-
        What the host's agents have used, from the events the host keeps. Anyone who can use
         the host may read it.
