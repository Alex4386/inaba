            type: object
            properties:
                present:
                    type: array
                    items:
                        $ref: '#/components/schemas/Presence'
                clients:
                    type: array
                    items:
                        type: string
                    description: |-
                        Every other browser tab with the same thread open, one's own included, but for those
                         that handed back its driver seat: whether the driver is still there, and whether this
                         browser is the one left to take a free seat.
                driver:
                    type: string
                    description: |-
                        The client id holding the thread's driver seat; empty when no browser still on the
                         thread holds it, as when its driver left or went quiet.
