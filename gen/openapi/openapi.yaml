                         seat someone else holds is taken only from one's own other browser tab, or by an
                         administrator.
                from:
                    type: string
                release:
                    type: boolean
                    description: Gives the seat up, when this browser holds it, for someone watching to take.
                give_to:
                    type: string
                    description: An administrator hands the seat, still held by from, to this client on the thread.
                visible:
                    type: boolean
                    description: |-
                        Whether the page is on screen now. Only a browser showing the thread holds back pushes
                         about it; one left open in a background tab does not.
                terminal_id:
                    type: string
                    description: |-
                        A host terminal it has open, whose driver seat take, from, release and give_to then
                         ask about, as they do a thread's.
