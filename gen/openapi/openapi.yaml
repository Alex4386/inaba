                    type: integer
                    format: uint32
        HeartbeatRequest:
            type: object
            properties:
                client_id:
                    type: string
                    description: A random id the browser tab keeps, so one person in two tabs is in two places.
                host_id:
                    type: string
                thread_id:
                    type: string
                    description: |-
                        What it has open: a thread, a project's page, or one of the host's terminals; at most
                         one of the three, all empty for none.
                project_id:
                    type: string
                take:
                    type: boolean
                    description: |-
                        Asks for the thread's driver seat: given only when it is free, or still held by from,
